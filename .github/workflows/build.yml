# Builds Vaultik and runs its tests on Linux and Windows for every push and pull request, so a
# change that breaks one platform is seen at once.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        type: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Install the distribution's packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++ cmake ninja-build pkg-config libzstd-dev libssl-dev \
            libcurl4-openssl-dev nlohmann-json3-dev doctest-dev qt6-base-dev libqt6svg6-dev
      - name: Build and test
        # As the runner's own (not root) account: as root, restores into /tmp are refused on
        # purpose (another account could swap a folder there for a link).
        run: BUILD_DIR="$RUNNER_TEMP/build-${{ matrix.type }}" ./build.sh ${{ matrix.type }} test

  windows:
    name: Windows (release)
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      # Packages vcpkg built (Qt above all) are kept between runs, so only the first one builds them.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite
      VCPKG_DOWNLOADS: ${{ github.workspace }}\vcpkg-downloads
    steps:
      - uses: actions/checkout@v4
      - name: Get vcpkg at the manifest's baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git clone --quiet https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout --quiet $baseline
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "${{ github.workspace }}\vcpkg-cache" | Out-Null
      # pcre2 (for Qt) reads a gitlink from GitHub's API and checks its hash against one form of the
      # answer, but GitHub answers in that form only sometimes (pretty-printed or compact JSON). The
      # file vcpkg expects is kept in tools/ci and put where vcpkg looks first, so it never asks.
      - name: Give vcpkg pcre2's sljit gitlink
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DOWNLOADS | Out-Null
          $file = Join-Path $env:VCPKG_DOWNLOADS 'pcre2-pcre2-10.49-sljit-gitlink.json'
          Copy-Item 'tools/ci/pcre2-pcre2-10.49-sljit-gitlink.json' $file
          $expected = '719fa1d8d8e1e749ce6f7370db32818268f84b1376ed9367fd5290ab440d8bea7a6a25a68e55045a45da68b0ce7a55daa0d7acd2f1b11774319b50268c02441c'
          $actual = (Get-FileHash $file -Algorithm SHA512).Hash.ToLower()
          if ($actual -ne $expected) { Write-Error "unexpected sljit gitlink: $actual"; exit 1 }
      - name: Restore vcpkg's built packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          # Each run saves under its own key; the newest one for this manifest is restored.
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-windows-${{ hashFiles('vcpkg.json') }}-
            vcpkg-windows-
      - name: Build
        shell: cmd
        run: build.cmd release
      # Saved right after the build, also when the tests then fail, so Qt is not built again.
      - name: Save vcpkg's built packages
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
      - name: Test
        shell: cmd
        run: ctest --preset release
