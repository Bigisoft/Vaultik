# Builds Vaultik and runs its tests on Linux and Windows for every push and pull request, so a
# change that breaks one platform is seen at once.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        type: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Install the distribution's packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++ cmake ninja-build pkg-config libzstd-dev libssl-dev \
            libcurl4-openssl-dev nlohmann-json3-dev doctest-dev qt6-base-dev libqt6svg6-dev \
            libfuse3-dev fuse3
      - name: Build and test
        # As the runner's own (not root) account: as root, restores into /tmp are refused on
        # purpose (another account could swap a folder there for a link).
        run: BUILD_DIR="$RUNNER_TEMP/build-${{ matrix.type }}" ./build.sh ${{ matrix.type }} test

  sanitizers:
    name: Linux (sanitizers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the distribution's packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++ cmake ninja-build pkg-config libzstd-dev libssl-dev \
            libcurl4-openssl-dev nlohmann-json3-dev doctest-dev libfuse3-dev fuse3
      # The engine and its tests with AddressSanitizer (memory errors, leaks) and
      # UndefinedBehaviorSanitizer; any finding stops the tests with its stack. Without the GUI,
      # which the sanitizers would also have to cover Qt for.
      - name: Build and test with AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          build="$RUNNER_TEMP/build-sanitizers"
          cmake -S . -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVAULTIK_BUILD_GUI=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build "$build"
          "$build/vaultik_tests"

  windows:
    name: Windows (release)
    # Visual Studio 2026, as the release builds use: with Visual Studio 2022, vcpkg's Qt comes out
    # with the older coroutine ABI that the Windows Hello code's C++20 coroutines cannot link with.
    runs-on: windows-2025
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      # Packages vcpkg built (Qt above all) are kept between runs, so only the first one builds them.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite
      VCPKG_DOWNLOADS: ${{ github.workspace }}\vcpkg-downloads
    steps:
      - uses: actions/checkout@v4
      - name: Get vcpkg at the manifest's baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git clone --quiet https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout --quiet $baseline
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "${{ github.workspace }}\vcpkg-cache" | Out-Null
      # pcre2 (for Qt) reads a gitlink from GitHub's API and checks its hash against one form of the
      # answer, but GitHub answers in that form only sometimes (pretty-printed or compact JSON). The
      # file vcpkg expects is kept in tools/ci and put where vcpkg looks first, so it never asks.
      - name: Give vcpkg pcre2's sljit gitlink
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DOWNLOADS | Out-Null
          $file = Join-Path $env:VCPKG_DOWNLOADS 'pcre2-pcre2-10.49-sljit-gitlink.json'
          Copy-Item 'tools/ci/pcre2-pcre2-10.49-sljit-gitlink.json' $file
          $expected = '719fa1d8d8e1e749ce6f7370db32818268f84b1376ed9367fd5290ab440d8bea7a6a25a68e55045a45da68b0ce7a55daa0d7acd2f1b11774319b50268c02441c'
          $actual = (Get-FileHash $file -Algorithm SHA512).Hash.ToLower()
          if ($actual -ne $expected) { Write-Error "unexpected sljit gitlink: $actual"; exit 1 }
      - name: Restore vcpkg's built packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          # Each run saves under its own key; the newest one for this manifest is restored.
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-windows-${{ hashFiles('vcpkg.json') }}-
            vcpkg-windows-
      - name: Build
        shell: cmd
        run: build.cmd release
      # Saved right after the build, also when the tests then fail, so Qt is not built again.
      - name: Save vcpkg's built packages
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
      # Run directly rather than through ctest, which keeps only the end of a long output: a failed
      # comparison can print whole file maps. The log gets the failures (shortened) and the tests'
      # messages (such as which virtual disk tests ran); the full output is kept as an artifact.
      - name: Test
        shell: pwsh
        # The runner has administrator rights: the disk tools test makes, attaches and erases a
        # small virtual disk of its own (and only that disk).
        env:
          VAULTIK_TEST_VIRTUAL_DISKS: '1'
        run: |
          & build\release\vaultik_tests.exe *> tests.log
          $code = $LASTEXITCODE
          Get-Content tests.log | Where-Object { $_ -match 'TEST CASE|ERROR|values:|THREW|MESSAGE|test cases|assertions' } |
              ForEach-Object { if ($_.Length -gt 400) { $_.Substring(0, 400) + ' ...' } else { $_ } }
          exit $code
      - name: Keep the test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-tests-log
          path: tests.log
          if-no-files-found: ignore
